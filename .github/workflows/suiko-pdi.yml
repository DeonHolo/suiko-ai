name: Suiko AI checks

on:
  pull_request:
    paths:
      - 'servicenow-app/**'
      - 'ai-review/**'
      - 'contracts/**'
      - 'prompts/**'
      - '.github/workflows/suiko-pdi.yml'
  push:
    branches: [main]
    paths:
      - 'servicenow-app/**'
      - 'ai-review/**'
      - 'contracts/**'
      - 'prompts/**'
      - '.github/workflows/suiko-pdi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            ai-review/package-lock.json
            servicenow-app/package-lock.json
      - name: Install review and app dependencies
        run: |
          npm --prefix ai-review ci
          npm --prefix servicenow-app ci
      - name: Run the review checks
        run: npm --prefix ai-review test
      - name: Check the newsroom screens
        run: npm --prefix servicenow-app run test:ui
      - name: Build the app with committed record identities
        run: npm --prefix servicenow-app run build -- --frozenKeys
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: suiko-pdi-package
          path: |
            servicenow-app/dist/
            servicenow-app/target/
          if-no-files-found: error
